<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Playground</title>
    <style>
        body{background:rgb(217, 217, 237); padding:20px;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
        .box { width: 200px; padding: 20px; margin: 10px; color: rgb(232, 238, 231); }
        .a { background: rgb(157, 38, 17); border: 4px solid rgb(188, 18, 18); }
        .b { background: teal; border-radius: 12px ; }
        .c { background: #826c6c; box-shadow: 4px 4px 10px rgba(0,0,0,.3); }

    </style>
</head>
<body>
    <div class="box a">Border Box</div>
    <div class="box b">Rounded Box</div>
    <div class="box c">Shadow Box</div>
</body>
</html>
