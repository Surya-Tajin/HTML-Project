<!DOCTYPE html>
<html >
<head>
    <title>Color palette</title>
    <style>
       body {font-family: sans-serif; text-align: center; }
h1 {color: #333; }
.box { width: 120px; height: 120px; display: inline-block; margin: 8px;
color: white; line-height: 120px; }

#red {background: #b30000; }
#blue {background: #02304d; }
#green {background: #034e07d3; }
#yellow {background: #f7e702e5; color: #333;}

</style>
</head>
<body>

<h1>My Colors</h1>
<div class="box" id="red">Red</div>
<div class="box" id="blue">Blue</div>
<div class="box" id="green">Green</div>
<div class="box" id="yellow">Yellow</div>
</body>
</html>
