<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <pre id="out" style ="font:14px/1.5 monospace;padding:16px;background:f5f5f5">
    </pre>
    <script>
        const log =m => document.getElementById("out").textContent += m+'\n';
        function greet(name = "Guest") {
            return "Hello, " + name;
        }
        log(greet("Alice"));
        log(greet());
        const sum = (...numbers) => numbers.reduce((a, b) => a + b, 0);
        log("sum(1, 2, 3) = " + sum(1, 2, 3));
    </script>
</body>
</html>
