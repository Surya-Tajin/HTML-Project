<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <pre id="out" style ="font:14px/1.5 monospace;padding:16px;background:f5f5f5">
    </pre>
    <script>
        const log =m => document.getElementById("out").textContent += m+'\n';
        const add = (a,b) => a+b;
        log("add(5,10) = " + add(5,10));
        const square = n => n*n;
        log("square(5) = " + square(5));
    </script>
</body>
</html>
